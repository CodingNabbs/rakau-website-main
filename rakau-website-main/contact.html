<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with the Rākau Indoors team.">
  <title data-mi="Rākau — Whakapā mai">Rākau — Contact</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Theme, applied before the page paints. Yes, it has to be inline, and yes, it has to be here.
       Move it to script.js and every page load starts with a white flash. Ask how we know. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('rakau-theme');
        var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <!-- Skip link. Must stay the first thing in <body>. Keyboard users should not have to
       tab through the whole menu on every page just to read anything. -->
  <a class="skip-link" href="#main" data-mi="Peke ki te ihirangi">Skip to content</a>

  <!-- Mobile menu overlay. Looks like an empty div. It is not. Don't delete it. -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- ========== Header / Navigation ========== -->
  <!-- This header is copy-pasted into every page, because we have no build step and no
       intention of adding one. Change it here, change it in the other four. All four. -->
  <header class="site-header" id="site-header">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" aria-label="Rākau home" data-mi-aria-label="Kāinga o Rākau">
        <img src="media/logo.svg" alt="Rākau logo: white pine trees inside a diamond" data-mi-alt="Waitohu o Rākau: he paina mā i roto i tētahi taimana" id="nav-logo-img">
      </a>

      <!-- Main menu. The active link is highlighted by script.js, which compares these hrefs
         to the filename. Keep them as bare filenames or it stops working. -->
      <nav class="site-nav" id="site-nav" aria-label="Primary" data-mi-aria-label="Matua">
        <ul>
          <li><a href="index.html" data-mi="Kāinga">Home</a></li>
          <li><a href="about.html" data-mi="Mō mātou">About</a></li>
          <li><a href="walks.html" data-mi="Hīkoi">Walks</a></li>
          <li><a href="gallery.html" data-mi="Whakaahua">Gallery</a></li>
          <li><a href="contact.html" data-mi="Whakapā mai">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <!-- Preferences: language and day/night, together in one slim capsule. They're the two
           settings, not pages, so they sit apart from the menu. -->
        <div class="nav-prefs">
        <!-- Language toggle: names the OTHER language, in that language ("Māori" while the site
           is in English, "English" while it's in te reo), like the day/night toggle names what it
           will do. Remembered across pages. script.js swaps every element with a data-mi
           translation and marks it lang="mi" so screen readers pronounce it properly. The hidden
           prefix gives screen readers the whole action: "Switch language to Māori". -->
        <button type="button" id="lang-toggle" class="lang-toggle"><svg class="globe-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5"></circle><ellipse cx="8" cy="8" rx="2.75" ry="6.5"></ellipse><path d="M1.5 8 H14.5"></path></svg><span class="visually-hidden"
            id="lang-toggle-prefix">Switch language to </span><span id="lang-toggle-name" lang="mi">Māori</span></button>

        <!-- Theme toggle. The tree grows leaves by day (light) and loses them by night (dark). Somebody
           thought this was clever; on reflection, they were right. Labels are set by script.js. -->
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to day" title="Switch to day">
          <svg class="tree-icon" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true" focusable="false">
            <path class="ground" d="M18 54 H46"></path>
            <path class="trunk" d="M32 54 L32 32"></path>
            <g class="branches">
              <path d="M32 32 L32 15"></path>
              <path d="M32 32 L20 19"></path>
              <path d="M32 32 L44 19"></path>
            </g>
            <g class="foliage">
              <circle class="leaf" cx="20" cy="19" r="8"></circle>
              <circle class="leaf" cx="44" cy="19" r="8"></circle>
              <circle class="leaf" cx="32" cy="15" r="10"></circle>
            </g>
          </svg>
        </button>
        </div>

        <!-- Hamburger. Three empty spans pretending to be an icon. Hidden above 720px. -->
        <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="site-nav"
          aria-label="Open menu" data-mi-aria-label="Whakatuwhera i te tahua">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========== Main content ========== -->
  <!-- Contact: the A2 "Say hello." form. Labels sit inside the fields and float up once you
       focus or type (pure CSS; see "Contact" in styles.css).
       NOT CONNECTED: there's no server yet, so script.js just checks the fields and shows a
       thank-you. Point the form's action at a real handler (Formspree, Netlify Forms...)
       and remove the submit handler in script.js before we tell anyone it works. -->
  <main id="main" class="page-main">
    <section class="contact" aria-labelledby="page-title">
      <h1 id="page-title" data-mi="Whakapā mai.">Say hello.</h1>
      <p class="contact-lede" data-mi="He pātai mō tētahi hīkoi, mō tētahi koha, mō tō pūkete rānei? Ka whakautu mātou i roto i ngā rā mahi e rua.">Questions about a walk, a gift or your account? We reply within two working days.</p>

      <form class="contact-form" id="contact-form" novalidate>
        <div class="field">
          <input type="text" id="name" name="name" autocomplete="name" placeholder=" " required>
          <label for="name" data-mi="Ingoa">Name</label>
        </div>
        <div class="field">
          <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required>
          <label for="email" data-mi="Īmēra">Email</label>
        </div>
        <div class="field field--full">
          <textarea id="message" name="message" rows="5" placeholder=" " required></textarea>
          <label for="message" data-mi="Karere">Message</label>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button type="submit" class="btn-pill" data-mi="Tukua">Send</button>
        <p class="form-note">pls no spam kthxbai</p>
      </form>

      <p class="form-success" id="form-success" role="status" tabindex="-1" hidden></p>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <a href="index.html" aria-label="Rākau home" data-mi-aria-label="Kāinga o Rākau">
        <img src="media/logo.svg" alt="Rākau logo: white pine trees inside a diamond" data-mi-alt="Waitohu o Rākau: he paina mā i roto i tētahi taimana" class="footer-logo">
      </a>

      <!-- Footer menu. Same links as the header. If they ever disagree, the header is right. -->
      <nav class="footer-nav" aria-label="Footer" data-mi-aria-label="Raro">
        <ul>
          <li><a href="index.html" data-mi="Kāinga">Home</a></li>
          <li><a href="about.html" data-mi="Mō mātou">About</a></li>
          <li><a href="walks.html" data-mi="Hīkoi">Walks</a></li>
          <li><a href="gallery.html" data-mi="Whakaahua">Gallery</a></li>
          <li><a href="contact.html" data-mi="Whakapā mai">Contact</a></li>
        </ul>
      </nav>

      <!-- Social links: our real YouTube, Instagram and Facebook pages. Same on every page. -->
      <ul class="footer-social">
        <li>
          <a href="https://www.youtube.com/@rakauindoors" target="_blank" rel="noopener"
            aria-label="Rākau on YouTube (opens in a new tab)" data-mi-aria-label="Rākau i YouTube (ka tuwhera ki tētahi ripa hou)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <rect x="2" y="5" width="20" height="14" rx="4"></rect>
              <path class="fill" d="M10 9 L15 12 L10 15 Z"></path>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/rakau_indoors/" target="_blank" rel="noopener"
            aria-label="Rākau on Instagram (opens in a new tab)" data-mi-aria-label="Rākau i Instagram (ka tuwhera ki tētahi ripa hou)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle class="fill" cx="17.5" cy="6.5" r="1"></circle>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.facebook.com/profile.php?id=61595049165122" target="_blank" rel="noopener"
            aria-label="Rākau on Facebook (opens in a new tab)" data-mi-aria-label="Rākau i Facebook (ka tuwhera ki tētahi ripa hou)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M14 8 H17 V4 H14 A4 4 0 0 0 10 8 V11 H7 V15 H10 V21 H14 V15 H17 L18 11 H14 Z"></path>
            </svg>
          </a>
        </li>
      </ul>
    </div>

    <div class="footer-bottom">
      <p>&copy; <span id="year"></span> Rākau &middot; all your base are belong to us</p>
      <!-- Back to top. Jumps to the header; the smooth scroll comes from the CSS, not magic. -->
      <a href="#site-header" class="back-to-top" data-mi="Hoki ki runga &uarr;">Back to top &uarr;</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>

</html>
